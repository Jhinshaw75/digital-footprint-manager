<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #202124;
            padding: 20px;
        }
        .audit-container {
            background: #ffffff;
            border: 2px solid #bdc1c6;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .audit-header {
            font-size: 26px;
            font-weight: 700;
            color: #003366;
            margin-bottom: 10px;
        }
        .audit-instructions {
            font-size: 16px;
            color: #3c4043;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .audit-input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #5f6368;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .audit-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.25);
        }
        .audit-btn {
            background-color: #003366;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .audit-btn:hover {
            background-color: #002244;
        }
        .results-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 6px solid #003366;
            border-radius: 6px;
        }
        .results-title {
            font-weight: 700;
            font-size: 18px;
            color: #003366;
            margin-bottom: 15px;
        }
        .resources-box {
            margin-bottom: 15px;
            font-size: 15px;
            background: #e8f0fe;
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid #1a73e8;
            line-height: 1.5;
        }
        .resources-box.warning {
            background: #fef7e0;
            border-left: 4px solid #f9ab00;
        }
        .resources-box a {
            color: #1a73e8;
            text-decoration: underline;
            display: inline-block;
            margin-top: 6px;
            font-weight: 700;
            font-size: 16px;
        }
        .checklist-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #dadce0;
        }
        .checklist-section-title {
            font-weight: 700;
            font-size: 17px;
            color: #202124;
            margin-bottom: 12px;
        }
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 16px;
            color: #202124;
            margin-bottom: 12px;
            cursor: pointer;
            line-height: 1.4;
        }
        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            cursor: pointer;
        }
        .template-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #dadce0;
        }
        .template-box {
            background: #ffffff;
            border: 2px solid #bdc1c6;
            border-radius: 6px;
            padding: 14px;
            font-family: monospace;
            font-size: 13px;
            color: #202124;
            white-space: pre-wrap;
            margin-top: 10px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .copy-btn {
            background-color: #3c4043;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background-color: #202124;
        }
        .status-log {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #e6f4ea;
            border: 2px solid #ceead6;
            border-radius: 6px;
            font-size: 15px;
            color: #137333;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="audit-container">
    <div class="audit-header">Operation Senior Shield: Digital Footprint & Privacy Guide</div>
    <div class="audit-instructions">
        Use this interactive guide to run security checks, track your progress step-by-step, and generate privacy opt-out notices.
    </div>
    
    <div class="input-group">
        <input type="text" id="targetInput" class="audit-input" placeholder="Enter your email or full name here...">
        <button class="audit-btn" onclick="runAdvancedScan()">Load Action Plan</button>
    </div>
    
    <div id="resultsArea" class="results-box">
        <div id="resultsTitle" class="results-title"></div>
        <div id="resultsContent"></div>
    </div>
</div>

<script>
function runAdvancedScan() {
    const val = document.getElementById('targetInput').value.trim() || "Your Identifier";
    const area = document.getElementById('resultsArea');
    const title = document.getElementById('resultsTitle');
    const content = document.getElementById('resultsContent');
    
    area.style.display = 'block';
    title.innerText = "🛡️ Your Personal Action Plan for: " + val;
    
    content.innerHTML = `
        <div class="resources-box">
            <div style="font-weight: 700; color: #174ea6; font-size: 17px; margin-bottom: 4px;">Step 1: Check for Corporate Data Breaches</div>
            <p style="margin: 0 0 6px 0;">Verify if your email has appeared in any known security breaches using the trusted public index:</p>
            <a href="https://haveibeenpwned.com" target="_blank">🔗 Open Have I Been Pwned (HaveIBeenPwned.com) &rarr;</a>
        </div>

        <div class="resources-box warning">
            <div style="font-weight: 700; color: #b06000; font-size: 17px; margin-bottom: 4px;">Step 2: Check Public Directories & Data Brokers</div>
            <p style="margin: 0 0 6px 0;">Search your records in a private window, then submit opt-out removals directly at these portals:</p>
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
                <a href="https://www.truepeoplesearch.com/removal" target="_blank">🔗 TruePeopleSearch Removal Form &rarr;</a>
                <a href="https://www.fastpeoplesearch.com/removal" target="_blank">🔗 FastPeopleSearch Removal Form &rarr;</a>
                <a href="https://www.whitepages.com/suppression-requests" target="_blank">🔗 Whitepages Suppression Request &rarr;</a>
                <a href="https://www.spokeo.com/optout" target="_blank">🔗 Spokeo Opt-Out Portal &rarr;</a>
            </div>
        </div>

        <div class="checklist-section">
            <div class="checklist-section-title">Step 3: Interactive Progress Checklist</div>
            <label class="checklist-item"><input type="checkbox"> Checked email on Have I Been Pwned and rotated passwords if needed.</label>
            <label class="checklist-item"><input type="checkbox"> Searched name/city in a private window for public directory listings.</label>
            <label class="checklist-item"><input type="checkbox"> Submitted formal opt-out notices to data brokers using the template below.</label>
        </div>
        
        <div class="template-section">
            <div style="font-weight: 700; font-size: 17px; color: #202124;">Step 4: Data Broker Removal Notice Template</div>
            <p style="margin: 6px 0;">Copy this notice and paste it into broker removal forms:</p>
            <div id="optOutTemplate" class="template-box">Subject: Formal Request to Opt-Out and Delete Personal Information

To Whom It May Concern,

Pursuant to applicable consumer privacy frameworks, I am formally requesting that you immediately remove, delete, and suppress all personal records, listings, and consumer data associated with my identity, including: ${val}.

Please confirm in writing once my information has been completely expunged from your public directories.

Sincerely,
[Your Name]
[Your Address / Contact Info]</div>
            <div class="btn-row">
                <button class="copy-btn" onclick="copyTemplate()">📋 Copy Template to Clipboard</button>
            </div>
            <div id="statusLog" class="status-log"></div>
        </div>
    `;
}

function copyTemplate() {
    const text = document.getElementById('optOutTemplate').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const log = document.getElementById('statusLog');
        log.style.display = 'block';
        log.innerHTML = "✓ Template copied successfully! Ready to paste into removal forms.";
    });
}
</script>

</body>
</html>
